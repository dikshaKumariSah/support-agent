<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroMart Support</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
    }
    .chat {
      width: 100%;
      max-width: 640px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }
    header {
      padding: 16px;
      background: #1f4e8c;
      color: white;
    }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      white-space: pre-wrap;  /* keep line breaks from Dhriti's replies */
    }
    .assistant { align-self: flex-start; background: #e9eef6; }
    .customer { align-self: flex-end; background: #1f4e8c; color: white; }
    .typing { font-style: italic; opacity: 0.7; }
    .error { align-self: center; background: #fdecea; color: #a12622; font-size: 14px; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #ddd;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #1f4e8c;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <h1>ElectroMart Customer Care</h1>
      <p>Chat with Dhriti, our virtual assistant</p>
    </header>

    <div id="messages"></div>

    <form id="chat-form">
      <input id="message" type="text" placeholder="Type your message..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    // Same text as GREETING in agent.py. If you change one, change both.
    const GREETING = "Thank you for contacting ElectroMart customer care. My name is Dhriti, your virtual assistant. How can I help you today?";

    // Empty at first. The server gives us an id with the first reply,
    // and we send it back with every next message.
    let conversationId = null;

    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const button = document.getElementById("send");

    function addMessage(text, cssClass) {
      const div = document.createElement("div");
      div.className = "message " + cssClass;
      div.textContent = text;  // textContent, not innerHTML: text is never run as HTML
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    addMessage(GREETING, "assistant");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();  // stop the browser from reloading the page
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "customer");
      input.value = "";
      button.disabled = true;
      const typing = addMessage("Dhriti is typing…", "assistant typing");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, conversation_id: conversationId }),
        });
        if (!response.ok) {
          throw new Error("Server answered " + response.status);
        }
        const data = await response.json();
        conversationId = data.conversation_id;
        typing.remove();
        addMessage(data.reply, "assistant");
      } catch (error) {
        console.error(error);
        typing.remove();
        addMessage("Sorry, something went wrong. Please refresh the page and try again.", "error");
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
